services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: woori_youtube
      POSTGRES_USER: youtube_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports: ["5434:5432"]
    volumes: ["youtube_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U youtube_agent -d woori_youtube"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  youtube_postgres:
