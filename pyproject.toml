[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "woori-youtube-agent"
version = "0.1.0"
description = "Local-first multilingual news video production and publishing pipeline"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "psycopg[binary]>=3.2", "alembic>=1.13", "pydantic-settings>=2.5", "PyYAML>=6.0", "feedparser>=6.0", "google-api-python-client>=2.140", "google-auth-oauthlib>=1.2", "kokoro>=0.9", "soundfile>=0.12", "matplotlib>=3.9", "Pillow>=10.4"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
woori-youtube = "woori_youtube.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
